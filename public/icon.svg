<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#grad1)" />
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Monitor / Tablet base -->
    <rect x="96" y="112" width="320" height="216" rx="20" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="12" />
    <!-- Screen content -->
    <rect x="120" y="136" width="272" height="168" rx="10" fill="#ffffff" />
    <!-- File/Document inside -->
    <path d="M160 176 h120 M160 208 h192 M160 240 h150 M160 272 h90" stroke="#0284c7" stroke-width="12" stroke-linecap="round" />
    <!-- Fast check / printer feed checkmark -->
    <circle cx="340" cy="256" r="32" fill="#10b981" />
    <path d="M328 256 l8 8 l16 -16" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Stand -->
    <rect x="236" y="328" width="40" height="48" fill="#ffffff" />
    <rect x="180" y="376" width="152" height="16" rx="8" fill="#ffffff" />
  </g>
  <!-- Coffee bean / cup accent on top corner -->
  <circle cx="396" cy="116" r="28" fill="#f59e0b" filter="url(#shadow)" />
  <path d="M386 116 h20 a10 10 0 0 1 0 10 a10 10 0 0 1 -10 10 a10 10 0 0 1 -10 -10 v-10 z" fill="#ffffff" />
  <path d="M406 119 h4 a4 4 0 0 1 0 8 h-4" fill="none" stroke="#ffffff" stroke-width="3" />
</svg>
